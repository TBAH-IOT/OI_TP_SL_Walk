<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GFI · Tín hiệu OI</title><style>
:root{color-scheme:dark;--bg:#0b0e14;--card:#151a23;--line:#27303c;--text:#eef2f7;--muted:#8c9caf;--cyan:#42d8c5;--red:#ff637f;--gold:#f2cb74}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,Arial,sans-serif}.shell{max-width:1180px;margin:auto;padding:24px}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:20px}.brand{font-weight:800;font-size:19px}.brand b{color:var(--gold)}
.bell{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 14px;font-size:18px}.bell small{background:var(--gold);color:#111;border-radius:12px;padding:2px 6px;font-size:11px}
h1{font-size:22px;margin:30px 0 4px}.sub{color:var(--muted);margin:0 0 18px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:14px}
.card,.detail{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px}.card{cursor:pointer}.card:hover{border-color:var(--cyan)}.top{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:700}.side{font-size:12px;color:var(--cyan)}.status{font-size:11px;border:1px solid var(--line);padding:4px 7px;border-radius:7px;color:var(--muted)}
.mini{height:112px;margin:12px 0;background:#1a222e;border-radius:7px;width:100%}.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;border-top:1px solid var(--line);padding-top:12px}.kv span,.metric span{display:block;color:var(--muted);font-size:12px}.kv b{display:block;margin-top:4px}.tp{color:var(--cyan)}.sl{color:var(--red)}
.detail{margin-top:22px;display:none}.detail.open{display:block}.detailhead{display:flex;justify-content:space-between;align-items:center}.detailhead button{background:none;border:0;color:var(--muted);font-size:24px;cursor:pointer}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0}.metric{background:#1b212b;border:1px solid var(--line);padding:18px;border-radius:12px}.metric b{display:block;font-size:26px;margin-top:8px}.equity{height:200px;width:100%;background:#1b212b;border-radius:10px}.note{color:var(--muted);font-size:12px}.empty{color:var(--muted);padding:35px;border:1px dashed var(--line);border-radius:12px}.toast{position:fixed;right:18px;top:18px;background:#1d2d33;border:1px solid var(--cyan);border-radius:12px;padding:14px 18px;box-shadow:0 10px 35px #0009;display:none;cursor:pointer;z-index:10}.toast.show{display:block}
</style></head><body><div class="shell"><header><div class="brand">✦ <b>GFI</b> Intelligence</div><button class="bell" title="5 tín hiệu gần nhất">🔔 <small id="count">0</small></button></header>
<h1>Setup mới của GFI</h1><p class="sub">Tối đa 5 tín hiệu gần nhất · Long · Nến 5 phút · Thời hạn 60 phút</p><div id="cards" class="cards"></div>
<section id="detail" class="detail"><div class="detailhead"><h2 id="detail-title">Backtest</h2><button id="close" aria-label="Đóng">×</button></div><p id="detail-note" class="note"></p><div id="metrics" class="metrics"></div><h3>Đường cong vốn</h3><svg id="equity" class="equity" viewBox="0 0 800 200" preserveAspectRatio="none"></svg><p class="note">Kết quả mô phỏng theo lệnh đã đóng trong 365 ngày gần nhất. Số liệu quá khứ không bảo đảm kết quả tương lai.</p></section></div><div id="toast" class="toast" role="status"></div>
<script>
const cards=document.getElementById('cards'),detail=document.getElementById('detail');let chosen=null,seen=null;
function fmt(n,d=2){return n==null?'Đang cập nhật':Number(n).toLocaleString('en-US',{maximumFractionDigits:d})}
function pct(n){return n==null?'Chưa có dữ liệu':fmt(n,2)+'%'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function chart(s){let actual=[...s.actual];if(s.last_price!=null&&s.last_price_ts)actual.push({ts:s.last_price_ts,price:s.last_price});const forecast=s.entry_price!=null?[{ts:s.entry_ts,price:s.entry_price},...(s.forecast||[])]:[],all=[...actual,...forecast].map(p=>p.price);if(!all.length)return '<svg class="mini" viewBox="0 0 300 100"></svg>';const lo=Math.min(...all),hi=Math.max(...all),times=[...actual,...forecast].map(p=>Date.parse(p.ts)),t0=Math.min(...times),t1=Math.max(...times,t0+1),x=t=>4+(Date.parse(t)-t0)/(t1-t0)*292,y=p=>96-(p-lo)/(hi-lo||1)*92,path=pts=>pts.map((p,i)=>`${i?'L':'M'}${x(p.ts).toFixed(1)},${y(p.price).toFixed(1)}`).join(' ');return `<svg class="mini" viewBox="0 0 300 100" preserveAspectRatio="none"><path d="${path(actual)}" stroke="#b5bec9" fill="none" stroke-width="2"/><path d="${path(forecast)}" stroke="#42d8c5" stroke-dasharray="3 3" fill="none" stroke-width="2"/></svg>`}
async function refresh(){try{const r=await fetch('/v1/notifications',{cache:'no-store'}),data=await r.json();document.getElementById('count').textContent=data.items.length;const ids=new Set(data.items.map(s=>s.id)),fresh=seen&&data.items.find(s=>!seen.has(s.id));seen=ids;if(fresh){const toast=document.getElementById('toast');toast.textContent=`🔔 Tín hiệu mới: ${fresh.symbol} Long`;toast.classList.add('show');toast.onclick=()=>{show(fresh.id);toast.classList.remove('show')};setTimeout(()=>toast.classList.remove('show'),7000)}cards.innerHTML=data.items.length?data.items.map(s=>{const last=s.actual.at(-1)?.price,projected=s.forecast?.at(-1)?.price;return `<article class="card" data-id="${esc(s.id)}" tabindex="0"><div class="top"><div>${esc(s.symbol)} <span class="side">▲ Long, 60 phút</span></div><span class="status">${esc(s.status_label)}</span></div>${chart(s)}<div class="kv"><div><span>Giá vào</span><b>$${fmt(s.entry_price,4)}</b></div><div><span>Giá hiện tại</span><b>$${fmt(s.last_price??last,4)}</b></div><div><span>Giá dự báo TB sau 60 phút</span><b class="tp">$${fmt(projected,4)}</b></div><div><span>Thời điểm thoát</span><b>${new Date(s.scheduled_exit_ts).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}</b></div></div><p class="note">Thoát tại giá đóng sau đúng 60 phút · Đường chấm: trung bình ${s.forecast_n} đường giá cùng coin. ${s.data_gap?'Thiếu dữ liệu để chốt kết quả.':''}</p></article>`}).join(''):'<div class="empty">Chưa có tín hiệu. Dữ liệu thật sẽ xuất hiện khi mô hình được kết nối.</div>';cards.querySelectorAll('.card').forEach(el=>{el.onclick=()=>show(el.dataset.id);el.onkeydown=e=>{if(e.key==='Enter')show(el.dataset.id)}});if(chosen&&detail.classList.contains('open'))show(chosen)}catch(e){cards.innerHTML='<div class="empty">Chưa kết nối được API tín hiệu.</div>'}}
function drawEquity(points){const svg=document.getElementById('equity');if(!points.length){svg.innerHTML='<text x="25" y="100" fill="#8c9caf">Chưa có lệnh backtest</text>';return}let vals=points.map(p=>p.equity_usd),lo=Math.min(...vals),hi=Math.max(...vals);svg.innerHTML=`<path d="${points.map((p,i)=>`${i?'L':'M'}${i/Math.max(points.length-1,1)*800},${190-(p.equity_usd-lo)/(hi-lo||1)*180}`).join(' ')}" fill="none" stroke="#42d8c5" stroke-width="3"/>`}
async function show(id){try{const r=await fetch('/v1/notifications/'+encodeURIComponent(id),{cache:'no-store'});if(!r.ok)return;const s=await r.json(),m=s.backtest;chosen=id;detail.classList.add('open');document.getElementById('detail-title').textContent=`${s.symbol} · Long, giữ 60 phút`;document.getElementById('detail-note').textContent=`${s.status_label} · ${m.trades} lệnh đã đóng · cửa sổ ${m.window_days} ngày · dự báo ${s.forecast_n} mẫu cùng coin`;document.getElementById('metrics').innerHTML=[['Tổng số lệnh backtest',m.trades],['Winrate sau phí',pct(m.winrate_pct)],['Tỷ lệ tăng giá trước phí',pct(m.gross_direction_accuracy_pct)],['PNL',pct(m.roi_pct)],['Max DD',pct(m.max_dd_pct)],['Sharpe ratio',m.sharpe_ratio==null?'Chưa đủ dữ liệu':fmt(m.sharpe_ratio)]].map(([k,v])=>`<div class="metric"><span>${k}</span><b>${v}</b></div>`).join('');drawEquity(m.equity_curve)}catch(e){}}
document.getElementById('close').onclick=()=>{detail.classList.remove('open');chosen=null};document.querySelector('.bell').onclick=()=>cards.scrollIntoView({behavior:'smooth'});refresh();setInterval(refresh,2000);
</script></body></html>
